<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/1999/REC-html401-19991224/strict.dtd">
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
		<title>Message from {shop_name}</title>
		<style>{global_mail_css}</style>
	</head>
	<body>
		<table class="qlo-container" cellpadding="0" cellspacing="0" role="presentation">
			<tr>
				<td>
					<table width="100%" cellpadding="0" cellspacing="0" role="presentation">
						<tr class="qlo-row-logo">
							<td class="qlo-logo">
								<a title="{shop_name}" href="{shop_url}" target="_blank">
									<img src="{shop_logo}" alt="{shop_name}" />
								</a>
							</td>
						</tr>
						<tr class="qlo-row-title">
							<td>
								<p class="qlo-heading">Your message to {shop_name} Customer Service</p>
							</td>
						</tr>
						<tr class="qlo-row-card">
							<td class="qlo-card">
								<p class="qlo-body-text">Your message has been sent successfully.</p>
								<p class="qlo-body-text"><strong>Message:</strong> {message}</p>
								<p class="qlo-body-text"><strong>Order ID:</strong> {order_name}</p>
								<p class="qlo-body-text"><strong>Product:</strong> {product_name}</p>
								<p class="qlo-body-text"><strong>Attached file:</strong> {attached_file}</p>
							</td>
						</tr>
						<tr class="qlo-row-note">
							<td class="qlo-body-text">
								We will answer as soon as possible.
							</td>
						</tr>
						<tr class="qlo-row-divider">
							<td class="qlo-divider">&nbsp;</td>
						</tr>
						<tr>
							<td class="qlo-footer-text">
								<a class="qlo-link" href="{shop_url}" target="_blank">{shop_name}</a> powered by <a class="qlo-link" href="https://webkul.com" target="_blank">Webkul&trade;</a>
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
